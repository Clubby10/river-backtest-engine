[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "river-backtest-engine"
version = "0.1.0"
description = "Portfolio backtesting with SMA and RSI strategies and a desktop interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "matplotlib", "customtkinter", "yfinance"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
river-backtest = "river_backtest.cli:main"
river-backtest-gui = "river_backtest.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
